<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Orange Clay Gradient -->
    <linearGradient id="clayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E40" />
      <stop offset="45%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Top Highlight Gradient -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Circle Soft Clay Gradient -->
    <linearGradient id="innerClay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FDE8D4" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- 3D Volumetric Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#9A3412" flood-opacity="0.32" />
    </filter>

    <!-- Inner Checkmark Shadow -->
    <filter id="checkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#C2410C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base 3D Squircle with soft shadow -->
  <rect x="36" y="32" width="440" height="440" rx="112" fill="url(#clayBg)" filter="url(#softShadow)" />

  <!-- Top-lit highlight layer -->
  <rect x="42" y="38" width="428" height="220" rx="106" fill="url(#topGlow)" />

  <!-- Inner Soft Clay Circle Button -->
  <circle cx="256" cy="252" r="142" fill="url(#innerClay)" />

  <!-- Checkmark with 3D drop shadow -->
  <path d="M194 256 L238 300 L324 204" 
        stroke="url(#checkGrad)" 
        stroke-width="34" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#checkShadow)" />
</svg>
